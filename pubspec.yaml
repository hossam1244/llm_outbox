name: llm_outbox
description: >-
  The offline-first persistence and reliability layer for LLM apps in Dart and
  Flutter: a persisted prompt queue with retry and dead-lettering, resumable
  conversation storage, a bring-your-own-key vault, and deterministic test
  doubles. Works with any LLM client via a tiny endpoint interface.
version: 0.1.0
repository: https://github.com/hossam1244/llm_outbox
issue_tracker: https://github.com/hossam1244/llm_outbox/issues
environment:
  sdk: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
